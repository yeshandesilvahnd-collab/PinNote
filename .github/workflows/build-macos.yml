name: Build macOS App & DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --windowed \
            --name "PinNote" \
            --icon "assets/icon.icns" \
            --add-data "assets:assets" \
            --osx-bundle-identifier "com.pinnote.app" \
            pin_note.py

      - name: Create DMG Installer
        run: |
          mkdir -p dmg_staging
          cp -R dist/PinNote.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PinNote" -srcfolder dmg_staging -ov -format UDZO dist/PinNote-v1.1.2.dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNote-macOS
          path: |
            dist/PinNote.app
            dist/PinNote-v1.1.2.dmg
